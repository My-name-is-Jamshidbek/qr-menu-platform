[pytest]
testpaths = e2e
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# `-r a` lists every non-passing outcome at the end, so a run's summary names
# the tests that need attention instead of only counting them.
addopts =
    --strict-markers
    --strict-config
    -r a
    --tb=short
    --durations=10

markers =
    slow: takes noticeably longer than a page load, e.g. a full CRUD cycle

# A browser test that hangs should fail the run, not the build's time budget.
faulthandler_timeout = 300

filterwarnings =
    error
    default::DeprecationWarning
